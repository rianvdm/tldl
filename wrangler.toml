name = "tldl"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_EPISODE_MINUTES = "121"
CACHE_TTL_DAYS = "365"
DEFAULT_TEMPLATE = "key-takeaways"
ENVIRONMENT = "production"
TURNSTILE_SITE_KEY = "0x4AAAAAACI8nqr-nsEAR6gr"
POSTMARK_FROM_EMAIL = "rian@elezea.com"
ADMIN_NOTIFICATION_EMAIL = "rianvdm@gmail.com"
POSTMARK_MESSAGE_STREAM = "tldl"

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.

# KV Namespace
[[kv_namespaces]]
binding = "TLDL_DATA"
id = "ee123158d5d54359b4257f8a1b678adf"

# Queue
[[queues.producers]]
binding = "TLDL_QUEUE"
queue = "tldl-jobs"

[[queues.consumers]]
queue = "tldl-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5

# Durable Object for job status (strong consistency)
[[durable_objects.bindings]]
name = "JOB_STATUS"
class_name = "JobStatusDO"

[[migrations]]
tag = "v1"
new_classes = ["JobStatusDO"]

# D1 database for email subscriptions
[[d1_databases]]
binding = "DB"
database_name = "tldl-subscribers"
database_id = "7492bd0d-f255-4a88-97b4-0966d8d826aa"

# Cron trigger for podcast monitoring
[triggers]
crons = ["0 */2 * * *"]  # Every 2 hours

