name = "tldl"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_EPISODE_MINUTES = "80"
CACHE_TTL_DAYS = "365"
DEFAULT_TEMPLATE = "key-takeaways"
ENVIRONMENT = "production"

[env.dev.vars]
MAX_EPISODE_MINUTES = "80"
CACHE_TTL_DAYS = "365"
DEFAULT_TEMPLATE = "key-takeaways"
ENVIRONMENT = "development"

# KV Namespace
[[kv_namespaces]]
binding = "TLDL_DATA"
id = "ee123158d5d54359b4257f8a1b678adf"

# Queue
[[queues.producers]]
binding = "TLDL_QUEUE"
queue = "tldl-jobs"

[[queues.consumers]]
queue = "tldl-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2

# Durable Object for job status (strong consistency)
[[durable_objects.bindings]]
name = "JOB_STATUS"
class_name = "JobStatusDO"

[[migrations]]
tag = "v1"
new_classes = ["JobStatusDO"]
