name = "tldl"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_EPISODE_MINUTES = "80"
CACHE_TTL_DAYS = "365"
DEFAULT_TEMPLATE = "key-takeaways"

# KV Namespace - create with: wrangler kv:namespace create TLDL_DATA
[[kv_namespaces]]
binding = "TLDL_DATA"
id = "<placeholder>"

# Queue - create with: wrangler queues create tldl-jobs
[[queues.producers]]
binding = "TLDL_QUEUE"
queue = "tldl-jobs"

[[queues.consumers]]
queue = "tldl-jobs"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 2
